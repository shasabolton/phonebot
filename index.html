<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Robot WiFi Setup</title>
  <style>
    body {
      font-family: Arial;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }
    .box {
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-top: 15px;
    }
    button {
      padding: 10px;
      margin-top: 10px;
      width: 100%;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
    }
    .ok { color: green; }
    .warn { color: orange; }
    .error { color: red; }
    .muted { color: #666; font-size: 0.9em; }
    #firmwarePanel { display: none; }
    #firmwarePanel button.secondary { background: #f0f0f0; }
    #firmwarePanel button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>

<body>

<h2>Robot Connection Setup</h2>

<div id="robotApp" class="box"></div>

<script src="wifiTransmitter.js"></script>
<script src="servo.js"></script>
<script src="robot.js"></script>
<script src="app.js"></script>

</body>
</html>
